<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nexus G Partners — Agency OS</title>
<style>
  :root {
    --bg: #0b1220; --card: #131c2e; --card2: #1a2740; --line: #243352;
    --text: #e8eef8; --dim: #8fa1bd; --accent: #f59e0b; --hot: #ef4444;
    --good: #22c55e; --blue: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; padding-bottom: 60px; }
  header { padding: 18px 16px 12px; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 20px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .refresh { background: var(--card2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 8px 14px; font-size: 14px; }
  section { margin: 14px 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 8px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card .num { font-size: 24px; font-weight: 700; }
  .card .lbl { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .card.money .num { color: var(--good); }
  .card.hot .num { color: var(--hot); }
  .card.warn .num { color: var(--accent); }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
  .row .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .row .name { font-weight: 600; font-size: 15px; }
  .row .meta { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
  .b-hot { background: rgba(239,68,68,.15); color: var(--hot); }
  .b-good { background: rgba(34,197,94,.15); color: var(--good); }
  .b-nurture { background: rgba(59,130,246,.15); color: var(--blue); }
  .b-stage { background: var(--card2); color: var(--dim); }
  .done-btn { background: var(--good); color: #04120a; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: 13px; }
  a.call { color: var(--accent); text-decoration: none; font-size: 13px; }
  .stage-col { margin-bottom: 10px; }
  .stage-head { font-size: 12px; color: var(--dim); margin: 6px 0; font-weight: 600; }
  .empty { color: var(--dim); font-size: 13px; padding: 10px 4px; }
  #keygate { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
  #keygate input { width: 100%; max-width: 340px; padding: 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 16px; margin: 12px 0; }
  #keygate button { background: var(--accent); color: #1a1a1a; border: 0; border-radius: 10px; padding: 14px 32px; font-size: 16px; font-weight: 700; }
  .hidden { display: none; }
  .err { color: var(--hot); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>

<div id="keygate">
  <h1>Nexus G <span>Partners</span></h1>
  <p class="sub">Enter your admin key to open the Agency OS</p>
  <input id="keyinput" type="password" placeholder="Admin key" autocomplete="off">
  <button onclick="saveKey()">Open Dashboard</button>
  <div id="keyerr" class="err"></div>
</div>

<header class="hidden" id="hdr">
  <div>
    <h1>Nexus G <span>Partners</span></h1>
    <div class="sub" id="timestamp">Agency OS</div>
  </div>
  <button class="refresh" onclick="load()">↻ Refresh</button>
</header>

<section id="revenue"></section>
<section id="tasks"></section>
<section id="pipeline"></section>
<section id="renewals"></section>
<section id="funnel"></section>

<script>
let KEY = localStorage.getItem('if_admin_key') || new URLSearchParams(location.search).get('key') || '';
if (KEY) localStorage.setItem('if_admin_key', KEY);

function saveKey() {
  KEY = document.getElementById('keyinput').value.trim();
  if (!KEY) return;
  localStorage.setItem('if_admin_key', KEY);
  load();
}

async function api(path) {
  const r = await fetch(path, { headers: { 'x-admin-key': KEY } });
  if (r.status === 401) throw new Error('401');
  return r.json();
}

const money = n => '$' + Math.round(n || 0).toLocaleString();
const dstr = d => d ? new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '—';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function bandBadge(b) {
  if (b === 'HOT') return '<span class="badge b-hot">HOT</span>';
  if (b === 'GOOD') return '<span class="badge b-good">GOOD</span>';
  if (b) return '<span class="badge b-nurture">' + esc(b) + '</span>';
  return '';
}

async function load() {
  try {
    const d = await api('/api/dashboard');
    document.getElementById('keygate').classList.add('hidden');
    document.getElementById('hdr').classList.remove('hidden');
    document.getElementById('timestamp').textContent = 'Updated ' + new Date().toLocaleTimeString();

    // Revenue cards
    document.getElementById('revenue').innerHTML = `
      <h2>Revenue</h2>
      <div class="cards">
        <div class="card money"><div class="num">${money(d.revenue.estCommission)}</div><div class="lbl">Est. commission (book)</div></div>
        <div class="card money"><div class="num">${money(d.revenue.totalPremium)}</div><div class="lbl">Active premium · ${d.revenue.activePolicies} policies</div></div>
        <div class="card"><div class="num">${d.revenue.boundThisMonth}</div><div class="lbl">Bound this month</div></div>
        <div class="card warn"><div class="num">${money(d.renewals.premiumAtRisk90d)}</div><div class="lbl">Renewal premium next 90d</div></div>
      </div>`;

    // Tasks
    const t = d.tasks;
    document.getElementById('tasks').innerHTML = `
      <h2>Tasks ${t.overdueCount ? `<span class="badge b-hot">${t.overdueCount} overdue</span>` : ''}</h2>
      ${t.open.length ? t.open.map(task => `
        <div class="row">
          <div class="top">
            <div class="name">${esc(task.title)}</div>
            <button class="done-btn" onclick="doneTask('${task.id}')">Done</button>
          </div>
          <div class="meta">${esc(task.type)} · due ${dstr(task.dueAt)} · ${esc(task.priority)}${task.lead ? ` · <a class="call" href="tel:${esc(task.lead.phone)}">${esc(task.lead.phone)}</a>` : ''}</div>
        </div>`).join('') : '<div class="empty">No open tasks. 🎉</div>'}`;

    // Pipeline
    const stages = d.pipeline.byStage;
    const stageOrder = ['NEW','QUALIFIED','RISK_PROFILED','SUBMITTED','QUOTED','PROPOSAL','BIND_PENDING','BOUND'];
    document.getElementById('pipeline').innerHTML = `
      <h2>Pipeline</h2>
      <div class="cards">
        ${stageOrder.filter(s => stages[s]).map(s => `
          <div class="card"><div class="num">${stages[s].count}</div><div class="lbl">${s}</div></div>`).join('')}
      </div>
      <div style="height:10px"></div>
      ${d.pipeline.open.slice(0, 15).map(o => `
        <div class="row">
          <div class="top">
            <div class="name">${esc(o.account?.company || 'Unknown')}</div>
            <span class="badge b-stage">${o.stage}</span>
          </div>
          <div class="meta">${esc(o.account?.state || '')} · ${o.account?.vehicleCount || '?'} units · X-date ${dstr(o.xDate)}${o.lead?.phone ? ` · <a class="call" href="tel:${esc(o.lead.phone)}">call</a>` : ''}</div>
        </div>`).join('') || '<div class="empty">No open opportunities yet.</div>'}`;

    // Renewals
    const r = d.renewals;
    document.getElementById('renewals').innerHTML = `
      <h2>Renewals</h2>
      <div class="cards">
        <div class="card hot"><div class="num">${r.buckets.next30}</div><div class="lbl">Next 30 days</div></div>
        <div class="card warn"><div class="num">${r.buckets.next60}</div><div class="lbl">Next 60 days</div></div>
        <div class="card"><div class="num">${r.buckets.next90}</div><div class="lbl">Next 90 days</div></div>
        <div class="card"><div class="num">${r.buckets.next120}</div><div class="lbl">Next 120 days</div></div>
      </div>
      <div style="height:10px"></div>
      ${r.upcoming.slice(0, 10).map(x => `
        <div class="row">
          <div class="top">
            <div class="name">${esc(x.account?.company || 'Unknown')}</div>
            <span class="badge b-stage">${dstr(x.renewalDate)}</span>
          </div>
          <div class="meta">${esc(x.policy?.carrier || '')} · ${money(x.incumbentPremium || x.policy?.premium)} · ${x.stage}</div>
        </div>`).join('') || '<div class="empty">No renewals on the runway.</div>'}`;

    // Funnel
    const fb = d.funnel.byBand, fs = d.funnel.byStatus;
    document.getElementById('funnel').innerHTML = `
      <h2>Lead Funnel</h2>
      <div class="cards">
        <div class="card hot"><div class="num">${fb.HOT || 0}</div><div class="lbl">HOT leads</div></div>
        <div class="card"><div class="num">${fb.GOOD || 0}</div><div class="lbl">GOOD</div></div>
        <div class="card"><div class="num">${fs.qualified || 0}</div><div class="lbl">Qualified</div></div>
        <div class="card"><div class="num">${fs.converted || 0}</div><div class="lbl">Converted</div></div>
      </div>
      <div class="meta" style="color:var(--dim);font-size:12px;margin-top:10px">
        Last 30 days: ${Object.entries(d.dispositions30d).map(([k, v]) => `${k}: ${v}`).join(' · ') || 'no calls logged'}
        <br>Cost (30d): $${d.costs.last30d}
      </div>`;
  } catch (e) {
    if (e.message === '401') {
      document.getElementById('keygate').classList.remove('hidden');
      document.getElementById('keyerr').textContent = 'Wrong key — try again.';
      localStorage.removeItem('if_admin_key');
    } else {
      console.error(e);
    }
  }
}

async function doneTask(id) {
  await fetch('/api/tasks/' + id + '/done', { method: 'POST', headers: { 'x-admin-key': KEY } });
  load();
}

if (KEY) load();
</script>
</body>
</html>
