<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lead Import — David Hughes Insurance</title>
<style>
  :root { --bg:#0b1220; --card:#131c2e; --card2:#1a2740; --line:#243352; --text:#e8eef8; --dim:#8fa1bd; --accent:#f59e0b; --good:#22c55e; --hot:#ef4444; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; max-width:560px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:20px; margin-bottom:4px; } h1 span { color:var(--accent); }
  .sub { color:var(--dim); font-size:13px; margin-bottom:22px; }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:16px 0 6px; }
  select, input[type=text] { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px; }
  .filebox { border:2px dashed var(--line); border-radius:12px; padding:28px 16px; text-align:center; color:var(--dim); font-size:14px; margin-top:6px; }
  .filebox.has { border-color:var(--good); color:var(--good); }
  .row { display:flex; align-items:center; gap:10px; margin-top:16px; font-size:14px; }
  .row input { width:18px; height:18px; }
  button { width:100%; margin-top:24px; background:var(--accent); color:#1a1a1a; border:0; border-radius:10px; padding:15px; font-size:16px; font-weight:700; }
  button:disabled { opacity:.4; }
  #result { margin-top:20px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; font-size:13px; white-space:pre-wrap; word-break:break-word; display:none; }
  #result.ok { border-color:var(--good); } #result.bad { border-color:var(--hot); color:var(--hot); }
  .hint { color:var(--dim); font-size:12px; margin-top:6px; }
</style>
</head>
<body>

<h1>Lead <span>Import</span></h1>
<div class="sub">Drop a scraper CSV — leads land in the pipeline. gosom google-maps-scraper format works as-is.</div>

<label for="f">CSV file</label>
<div class="filebox" id="filebox">
  <input type="file" id="f" accept=".csv,text/csv" style="display:none">
  <span id="fname">Tap to choose file</span>
</div>

<label for="vertical">Pipeline</label>
<select id="vertical">
  <option value="life_fe">Life (final expense)</option>
  <option value="commercial_auto">Commercial auto</option>
</select>

<label for="source">Source tag (ROI tracking)</label>
<input type="text" id="source" value="gmaps_local" placeholder="gmaps_local, hasdata, apollo…">
<div class="hint">Shows up in the lead's <code>source</code> field so you can see which scraper pays.</div>

<div class="row">
  <input type="checkbox" id="autocall">
  <label for="autocall" style="margin:0;text-transform:none;letter-spacing:0;color:var(--text);font-size:14px;">Queue calls immediately (90s apart)</label>
</div>

<button id="go" disabled>Import Leads</button>
<div id="result"></div>

<script>
let KEY = localStorage.getItem('if_admin_key') || new URLSearchParams(location.search).get('key') || '';
if (KEY) localStorage.setItem('if_admin_key', KEY);

const f = document.getElementById('f');
const box = document.getElementById('filebox');
const fname = document.getElementById('fname');
const go = document.getElementById('go');
const out = document.getElementById('result');

box.addEventListener('click', () => f.click());
f.addEventListener('change', () => {
  if (f.files.length) {
    fname.textContent = f.files[0].name + ' (' + Math.round(f.files[0].size/1024) + ' KB)';
    box.classList.add('has');
    go.disabled = false;
  }
});

go.addEventListener('click', async () => {
  if (!f.files.length) return;
  go.disabled = true;
  out.style.display = 'block';
  out.className = '';
  out.textContent = 'Importing…';
  try {
    const csv = await f.files[0].text();
    const body = {
      vertical: document.getElementById('vertical').value,
      source: document.getElementById('source').value.trim() || undefined,
      autoCall: document.getElementById('autocall').checked,
      csv
    };
    const r = await fetch('/api/import/leads?key=' + encodeURIComponent(KEY), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    out.classList.add('ok');
    out.textContent = '✅ Imported: ' + d.imported + '\n⏭️ Skipped (dup/bad/state): ' + d.skipped +
      (d.errors ? '\n⚠️ Errors: ' + d.errors : '') +
      (d.queued ? '\n📞 Calls queued: ' + d.queued : '\n📞 No calls queued (checkbox off)');
  } catch (e) {
    out.classList.add('bad');
    out.textContent = '❌ ' + e.message + (String(e.message).includes('Unauthorized') ? '\n\nAdmin key missing — open this page once with ?key=YOUR_ADMIN_KEY' : '');
  }
  go.disabled = false;
});
</script>
</body>
</html>
