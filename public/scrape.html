<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Run a Scrape — David Hughes Insurance</title>
<style>
  :root { --bg:#0b1220; --card:#131c2e; --card2:#1a2740; --line:#243352; --text:#e8eef8; --dim:#8fa1bd; --accent:#f59e0b; --good:#22c55e; --hot:#ef4444; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; max-width:560px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:20px; margin-bottom:4px; } h1 span { color:var(--accent); }
  .sub { color:var(--dim); font-size:13px; margin-bottom:22px; line-height:1.5; }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:16px 0 6px; }
  select, input[type=text] { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .chip { background:var(--card2); border:1px solid var(--line); border-radius:20px; padding:7px 14px; font-size:13px; color:var(--text); cursor:pointer; }
  .chip:active { background:var(--accent); color:#1a1a1a; }
  button.go { width:100%; margin-top:24px; background:var(--accent); color:#1a1a1a; border:0; border-radius:10px; padding:15px; font-size:16px; font-weight:700; }
  button.go:disabled { opacity:.4; }
  #result { margin-top:20px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; font-size:13px; white-space:pre-wrap; word-break:break-word; display:none; }
  #result.ok { border-color:var(--good); } #result.bad { border-color:var(--hot); color:var(--hot); }
  .links { margin-top:26px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--dim); }
  .links a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>

<h1>Run a <span>Scrape</span></h1>
<div class="sub">Pick a niche + city, tap the button. HasData scrapes Google Maps server-side and leads drop straight into the life pipeline (no calls fire — import only).</div>

<label for="query">Niche</label>
<input type="text" id="query" placeholder="barbershops" list="niches">
<datalist id="niches">
  <option value="barbershops"><option value="roofers"><option value="landscapers">
  <option value="restaurant owners"><option value="auto repair shops"><option value="plumbers">
  <option value="electricians"><option value="tattoo shops"><option value="gyms">
  <option value="bakeries"><option value="cleaning companies"><option value="trucking companies">
  <option value="real estate agents"><option value="hair salons"><option value="nail salons">
</datalist>
<div class="chips">
  <span class="chip" onclick="setQ('barbershops')">barbershops</span>
  <span class="chip" onclick="setQ('roofers')">roofers</span>
  <span class="chip" onclick="setQ('landscapers')">landscapers</span>
  <span class="chip" onclick="setQ('restaurant owners')">restaurants</span>
  <span class="chip" onclick="setQ('auto repair shops')">auto repair</span>
  <span class="chip" onclick="setQ('trucking companies')">trucking</span>
</div>

<label for="city">City (licensed states only)</label>
<select id="city">
  <optgroup label="Michigan">
    <option>Detroit, MI</option><option>Grand Rapids, MI</option><option>Lansing, MI</option>
    <option>Flint, MI</option><option>Ann Arbor, MI</option>
  </optgroup>
  <optgroup label="Arizona">
    <option>Phoenix, AZ</option><option>Tucson, AZ</option><option>Mesa, AZ</option><option>Scottsdale, AZ</option>
  </optgroup>
  <optgroup label="Tennessee">
    <option>Memphis, TN</option><option>Nashville, TN</option><option>Knoxville, TN</option><option>Chattanooga, TN</option>
  </optgroup>
  <optgroup label="Florida">
    <option>Jacksonville, FL</option><option>Miami, FL</option><option>Tampa, FL</option>
    <option>Orlando, FL</option><option>Fort Lauderdale, FL</option>
  </optgroup>
</select>

<button class="go" id="go">Run Scrape</button>
<div id="result"></div>

<div class="links">
  <a href="/calls.html">Start / Stop calls</a> · Have a CSV? <a href="/import.html">Upload it</a> · <a href="/dashboard">Agency OS dashboard</a>
</div>

<script>
let KEY = localStorage.getItem('if_admin_key') || new URLSearchParams(location.search).get('key') || '';
if (KEY) localStorage.setItem('if_admin_key', KEY);

const go = document.getElementById('go');
const out = document.getElementById('result');

function setQ(v) { document.getElementById('query').value = v; }

go.addEventListener('click', async () => {
  const query = document.getElementById('query').value.trim();
  const city = document.getElementById('city').value;
  if (!query) { out.style.display='block'; out.className='bad'; out.textContent='❌ Pick a niche first'; return; }
  go.disabled = true;
  out.style.display = 'block';
  out.className = '';
  out.textContent = '⏳ Scraping "' + query + '" in ' + city + '… (HasData takes ~20-60s)';
  try {
    const r = await fetch('/api/scraper/hasdata/run?key=' + encodeURIComponent(KEY), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, city, start: 0 })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error === 'HasData request failed'
      ? 'HasData request failed (HTTP ' + (d.detail || '?') + ') — check HASDATA_API_KEY in Railway → Variables'
      : (d.error || ('HTTP ' + r.status)));
    out.classList.add('ok');
    out.textContent = '✅ ' + query + ' / ' + d.city + '\n📥 Imported: ' + d.imported + '\n⏭️ Skipped (dup/no phone): ' + d.skipped +
      '\n\nCalls stay OFF until you press START on the Call Engine page (link below).';
  } catch (e) {
    out.classList.add('bad');
    out.textContent = '❌ ' + e.message + (String(e.message).includes('Unauthorized') ? '\n\nAdmin key missing — open this page once with ?key=YOUR_ADMIN_KEY' : '');
  }
  go.disabled = false;
});
</script>
</body>
</html>
