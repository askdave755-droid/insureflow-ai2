<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Start / Stop Calls — David Hughes Insurance</title>
<style>
  :root { --bg:#0b1220; --card:#131c2e; --card2:#1a2740; --line:#243352; --text:#e8eef8; --dim:#8fa1bd; --accent:#f59e0b; --good:#22c55e; --hot:#ef4444; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; max-width:560px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:20px; margin-bottom:4px; } h1 span { color:var(--accent); }
  .sub { color:var(--dim); font-size:13px; margin-bottom:22px; line-height:1.5; }
  #statusCard { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; text-align:center; }
  #dot { display:inline-block; width:14px; height:14px; border-radius:50%; background:var(--dim); margin-right:8px; vertical-align:middle; }
  #dot.on { background:var(--good); box-shadow:0 0 10px var(--good); }
  #dot.off { background:var(--hot); box-shadow:0 0 10px var(--hot); }
  #stateTxt { font-size:18px; font-weight:700; vertical-align:middle; }
  #meta { color:var(--dim); font-size:13px; margin-top:10px; line-height:1.7; }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:20px 0 6px; }
  input[type=number] { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px; }
  button.go { width:100%; margin-top:16px; border:0; border-radius:10px; padding:16px; font-size:17px; font-weight:700; cursor:pointer; }
  button.go:disabled { opacity:.4; }
  #start { background:var(--good); color:#06240f; }
  #stop { background:var(--hot); color:#2a0a0a; }
  #result { margin-top:20px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; font-size:13px; white-space:pre-wrap; word-break:break-word; display:none; }
  #result.ok { border-color:var(--good); } #result.bad { border-color:var(--hot); color:var(--hot); }
  .links { margin-top:26px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--dim); }
  .links a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>

<h1>Call <span>Engine</span></h1>
<div class="sub">START queues pending life leads (oldest first, one call every 90 seconds) and resumes the dialer. STOP pauses it — calls in progress finish, nothing new dials. Business hours are enforced per lead state automatically.</div>

<div id="statusCard">
  <span id="dot"></span><span id="stateTxt">CHECKING…</span>
  <div id="meta"></div>
</div>

<label for="limit">How many to queue on START</label>
<input type="number" id="limit" value="20" min="1" max="100">

<button class="go" id="start">▶ START CALLING</button>
<button class="go" id="stop">⏹ STOP CALLING</button>
<div id="result"></div>

<div class="links">
  <a href="/scrape.html">Run a scrape</a> · <a href="/import.html">Upload CSV</a> · <a href="/dashboard">Agency OS dashboard</a>
</div>

<script>
let KEY = localStorage.getItem('if_admin_key') || new URLSearchParams(location.search).get('key') || '';
if (KEY) localStorage.setItem('if_admin_key', KEY);

const out = document.getElementById('result');
const dot = document.getElementById('dot');
const stateTxt = document.getElementById('stateTxt');
const meta = document.getElementById('meta');
const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');

function show(cls, msg) { out.style.display = 'block'; out.className = cls; out.textContent = msg; }
function authHint(msg) { return String(msg).includes('Unauthorized') ? msg + '\n\nAdmin key missing — open this page once with ?key=YOUR_ADMIN_KEY' : msg; }

async function refresh() {
  try {
    const r = await fetch('/api/life/calls/status?key=' + encodeURIComponent(KEY));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    const isPaused = d.paused !== false;   // null (unknown) treated as paused — safe default
    dot.className = isPaused ? 'off' : 'on';
    stateTxt.textContent = isPaused ? '⏸ PAUSED' : '● CALLING';
    const c = d.counts || {};
    meta.innerHTML =
      'Pending life leads: <b>' + d.pendingLife + '</b><br>' +
      'In queue now: ' + (c.waiting ?? '?') + ' waiting · ' + (c.active ?? '?') + ' on a call · ' + (c.delayed ?? '?') + ' scheduled';
  } catch (e) {
    dot.className = '';
    stateTxt.textContent = 'STATUS UNKNOWN';
    meta.textContent = authHint(e.message);
  }
}

startBtn.addEventListener('click', async () => {
  const limit = Math.min(Math.max(parseInt(document.getElementById('limit').value) || 20, 1), 100);
  startBtn.disabled = true;
  show('', '⏳ Queueing up to ' + limit + ' leads…');
  try {
    const r = await fetch('/api/life/calls/start?limit=' + limit + '&key=' + encodeURIComponent(KEY));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    show('ok', '▶ STARTED — ' + d.queued + ' leads queued, one call every ' + d.spacingSeconds + 's.\nAfter-hours leads self-reschedule to the next calling window.');
  } catch (e) { show('bad', '❌ ' + authHint(e.message)); }
  startBtn.disabled = false;
  refresh();
});

stopBtn.addEventListener('click', async () => {
  stopBtn.disabled = true;
  show('', '⏳ Pausing…');
  try {
    const r = await fetch('/api/life/calls/stop?key=' + encodeURIComponent(KEY));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    show('ok', '⏹ STOPPED — ' + d.message);
  } catch (e) { show('bad', '❌ ' + authHint(e.message)); }
  stopBtn.disabled = false;
  refresh();
});

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
